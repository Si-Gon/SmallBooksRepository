server:
  port: 8092

spring:
  application:
    name: ingestion-service
  datasource:
    url: jdbc:mysql://localhost:3306/db_ingestion?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  # Tamaño máximo de archivo permitido: 50MB
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Ruta local donde se guardan los archivos
# Cambiar según el sistema operativo
storage:
  local:
    path: C:/smallbooks/archivos/

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/