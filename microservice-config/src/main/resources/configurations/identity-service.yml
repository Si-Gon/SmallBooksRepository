server:
  port: 8084

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:mysql://localhost:3306/db_identity?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false

jwt:
  secret: Duoc.1983Duoc.1983Duoc.1983Duoc.1983
  access-token-expiration: 1800000     # 30 minutos
  refresh-token-expiration: 604800000  # 7 días

# Se registra en Eureka para que el gateway lo encuentre por nombre
eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/