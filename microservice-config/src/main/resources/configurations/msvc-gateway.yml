server:
  port: 8080

spring:
  application:
    name: msvc-gateway
  cloud:
    gateway:
      # Habilita la observabilidad (tracing) en el Gateway reactivo.
      # Micrometer Tracing genera el traceId al entrar y lo propaga
      # automaticamente al microservicio destino via headers B3.
      observability:
        enabled: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:

        - id: identity-service-public
          uri: lb://identity-service
          predicates:
            - Path=/auth/**

        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/catalog/**
          filters:
            - name: JwtAuthFilter

        - id: license-service
          uri: lb://license-service
          predicates:
            - Path=/api/licenses/**
          filters:
            - name: JwtAuthFilter

        - id: elending-service
          uri: lb://elending-service
          predicates:
            - Path=/api/lending/**
          filters:
            - name: JwtAuthFilter

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: JwtAuthFilter

        - id: subscription-service
          uri: lb://subscription-service
          predicates:
            - Path=/api/subscriptions/**
          filters:
            - name: JwtAuthFilter

        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/search/**
          filters:
            - name: JwtAuthFilter

        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/analytics/**
          filters:
            - name: JwtAuthFilter

        - id: ingestion-service
          uri: lb://ingestion-service
          predicates:
            - Path=/api/ingestion/**
          filters:
            - name: JwtAuthFilter

        - id: content-service
          uri: lb://content-service
          predicates:
            - Path=/api/content/**
          filters:
            - name: JwtAuthFilter

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

# ──────────────────────────────────────────────
# Configuración del rate limiter Bucket4j
# ──────────────────────────────────────────────
# Bucket4j aplica el algoritmo Token Bucket en memoria (ConcurrentHashMap).
# Sin Redis — los contadores viven dentro del proceso del gateway.
#
# global:  Límite total del gateway (protege los 13 servicios de saturación)
# per-ip:  Límite individual por cliente (fair use — un cliente no bloquea a otros)
rate-limiting:
  global:
    capacity: 1000          # Máximo de tokens en el bucket global
    refill-per-minute: 1000 # Tokens que se regeneran cada minuto
  per-ip:
    capacity: 50            # Máximo de tokens por IP
    refill-per-minute: 50   # Tokens que se regeneran cada minuto por IP

# ──────────────────────────────────────────────
# Configuración CORS — orígenes permitidos
# ──────────────────────────────────────────────
# Lista separada por comas de orígenes que pueden
# hacer peticiones al gateway desde el navegador.
# En producción, reemplazar con los dominios reales
# del frontend (ej: https://admin.misitio.com).
gateway:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:3000,http://localhost:5173

jwt:
  secret: ${JWT_SECRET}
