server:
  port: 8888

spring:
  profiles:
    active: native
  application:
    name: config-server
  cloud:
    config:
      server:
        # ── SEGURIDAD: NO resolver placeholders del lado del servidor ─────
        # Por defecto, Config Server resuelve ${...} con su propio Environment.
        # Esto obligaria a poner JWT_SECRET (y otros secretos) en el entorno
        # del Config Server, exponiendolos a todos los servicios.
        #
        # Con resolve-placeholders: false, cada microservicio resuelve sus
        # propias variables de entorno. El Config Server pasa el texto ${...}
        # sin modificar, y el cliente (gateway, identity, etc.) lo interpreta
        # contra su propio Environment, manteniendo los secretos aislados.
        resolve-placeholders: false
        native:
          search-locations: classpath:/configurations
logging:
  pattern:
    level: "%5p [%mdc{traceId:-NONE} %mdc{spanId:-NONE}]"

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always