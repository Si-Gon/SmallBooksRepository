version: '3.8'

services:

  # ─── 1. CONFIG SERVER ───────────────────────────────────────────────────────
  config:
    build:
      context: ./microservice-config
    container_name: config-server
    depends_on:
      zipkin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 10s      # cada 10 segundos pregunta si está listo
      timeout: 5s        # espera máximo 5 segundos la respuesta
      retries: 10        # intenta 10 veces antes de declararlo fallido
      start_period: 30s  # espera 30s antes de empezar a preguntar

    # ─── 2. EUREKA ──────────────────────────────────────────────────────────────
  eureka:
    build:
      context: ./microservice-eureka
    container_name: eureka-server
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    depends_on:
      config:
        condition: service_healthy # espera a que config esté listo antes de iniciar eureka
      zipkin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── 3. GATEWAY ─────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ./microservice-gateway
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ─── 4. IDENTITY ────────────────────────────────────────────────────────────
  identity:
    build:
      context: ./identity-services
    container_name: identity
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_IDENTITY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  # ─── 5. CATALOG ─────────────────────────────────────────────────────────────
  catalog:
    build:
      context: ./catalog-service
    container_name: catalog
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_CATALOG}
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  # ─── 6. LICENSE ─────────────────────────────────────────────────────────────
  license:
    build:
      context: ./license-service
    container_name: license
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_LICENSE}
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  # ─── 7. E-LENDING ───────────────────────────────────────────────────────────
  elending:
    build:
      context: ./elending-service
    container_name: elending
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_ELENDING}
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  # ─── 8. NOTIFICATION ────────────────────────────────────────────────────────
  notification:
    build:
      context: ./notification-service
    container_name: notification
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_NOTIFICATION}
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  # ─── 9. SUBSCRIPTION ────────────────────────────────────────────────────────
  subscription:
    build:
      context: ./subscription-service
    container_name: subscription
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_SUBSCRIPTION}
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  # ─── 10. SEARCH ─────────────────────────────────────────────────────────────
  search:
    build:
      context: ./search-service
    container_name: search
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  # ─── 11. ANALYTICS ──────────────────────────────────────────────────────────
  analytics:
    build:
      context: ./analytics-service
    container_name: analytics
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  # ─── 12. INGESTION ──────────────────────────────────────────────────────────
  ingestion:
    build:
      context: ./ingestion-service
    container_name: ingestion
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_INGESTION}
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  # ─── 13. CONTENT ────────────────────────────────────────────────────────────
  content:
    build:
      context: ./content-service
    container_name: content
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy

  # ─── 14. ZIPKIN ──────────────────────────────────────────────────────────────
  zipkin:
    image: openzipkin/zipkin:3.4.2
    container_name: zipkin
    ports:
      - "9411:9411"     # UI — http://localhost:9411
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── 15. RABBITMQ ────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"     # AMQP — conexión de servicios
      - "15672:15672"   # Management UI — http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s