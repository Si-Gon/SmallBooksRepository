# Perfil de test para microservice-gateway
# El gateway necesita jwt.secret para que JwtAuthFilter pueda inyectarlo con @Value.
# Desactivamos Config Server y Eureka para no necesitar infraestructura externa.

spring:
  config:
    import: ""
  cloud:
    config:
      enabled: false
    gateway:
      # Sin rutas definidas en test — el filtro se testa de forma unitaria
      routes: []

eureka:
  client:
    enabled: false

# Límites reducidos para tests de rate limiting
# Los valores por defecto (@Value con ":") también funcionan, pero
# tenerlos explicitados evita sorpresas si alguien cambia los defaults
rate-limiting:
  global:
    capacity: 100
    refill-per-minute: 100
  per-ip:
    capacity: 10
    refill-per-minute: 10

# ─── CORS — orígenes permitidos para tests ──────────────────────
# Se definen explícitamente para que CorsConfigTest pueda verificar
# que los valores se inyectan correctamente.
gateway:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:3000,http://localhost:5173

# Secret de 32+ caracteres requerido por HMAC-SHA256
# En producción viene del Config Server — aquí lo ponemos fijo para tests
jwt:
  secret: "clave-secreta-de-prueba-para-tests-unitarios-32chars"

logging:
  level:
    root: WARN
