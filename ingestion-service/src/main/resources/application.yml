spring:
  application:
    name: ingestion-service
  config:
    import: optional:configserver:http://localhost:8888

logging:
  file:
    name: logs/smallbooks.log
  level:
    root: INFO
    com.silvio: DEBUG
  pattern:
    level: "%5p [%mdc{traceId:-NONE} %mdc{spanId:-NONE}]"

# Tracing distribuido — fallback local cuando el Config Server no está disponible
management:
  tracing:
    sampling:
      probability: 1.0