# Perfil de test para search-service
# Sin base de datos — solo consulta al catalog-service via Feign.
# CatalogClient se mockea en cada test con @MockBean.

spring:
  config:
    import: ""
  cloud:
    config:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

eureka:
  client:
    enabled: false

logging:
  level:
    root: WARN
