spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:http://localhost:8888

  # RabbitMQ — consumidor de eventos de notificación con Dead Letter Queue
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        observation-enabled: true  # Restaura traceId desde headers AMQP
        # NOTA: La configuración programática en RabbitMQConfig (RetryInterceptorBuilder
        # con RejectAndDontRequeueRecoverer) anula esta config YAML porque el bean
        # rabbitListenerContainerFactory personalizado toma precedencia sobre el default.
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10s

logging:
  file:
    name: logs/smallbooks.log
  level:
    root: INFO
    com.silvio: DEBUG
  pattern:
    level: "%5p [%mdc{traceId:-NONE} %mdc{spanId:-NONE}]"

# Tracing distribuido — fallback local cuando el Config Server no está disponible
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health