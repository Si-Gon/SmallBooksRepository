spring:
  application:
    name: subscription-service
  config:
    import: optional:configserver:http://localhost:8888

logging:
  file:
    name: logs/smallbooks.log
  level:
    root: INFO
    com.silvio: DEBUG
  pattern:
    level: "%5p [%mdc{traceId:-NONE} %mdc{spanId:-NONE}]"

# Tracing distribuido — fallback local cuando el Config Server no está disponible
management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans