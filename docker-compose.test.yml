version: '3.8'

services:
  # ─── Infraestructura base ────────────────────────────────────────────────
  config:
    build:
      context: ./microservice-config
    container_name: config-server-test
    depends_on:
      zipkin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  eureka:
    build:
      context: ./microservice-eureka
    container_name: eureka-server-test
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
    depends_on:
      config:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mysql-test:
    image: mysql:8.0
    container_name: mysql-test
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  zipkin:
    image: openzipkin/zipkin:3.4.2
    container_name: zipkin-test
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-test
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Servicios del escenario de test ─────────────────────────────────────
  catalog:
    build:
      context: ./catalog-service
    container_name: catalog-test
    ports:
      - "8085:8085"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-test:3306/db_catalog?useSSL=false&serverTimezone=UTC
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      mysql-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  elending:
    build:
      context: ./elending-service
    container_name: elending-test
    ports:
      - "8087:8087"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-test:3306/db_lending?useSSL=false&serverTimezone=UTC
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      mysql-test:
        condition: service_healthy
      catalog:
        condition: service_healthy
      license:                          
        condition: service_healthy 
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  ingestion:
    build:
      context: ./ingestion-service
    container_name: ingestion-test
    ports:
      - "8092:8092"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-test:3306/db_ingestion?useSSL=false&serverTimezone=UTC
      - STORAGE_LOCAL_PATH=/app/archivos/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    volumes:
      - ingestion-test-files:/app/archivos
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      mysql-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8092/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  notification:
    build:
      context: ./notification-service
    container_name: notification-test
    ports:
      - "8088:8088"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-test:3306/db_notifications?useSSL=false&serverTimezone=UTC
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      mysql-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  content:
    build:
      context: ./content-service
    container_name: content-test
    ports:
      - "8093:8093"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      elending:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8093/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  license:
    build:
      context: ./license-service
    container_name: license-test
    ports:
      - "8086:8086"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-test:3306/db_license?useSSL=false&serverTimezone=UTC
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    depends_on:
      config:
        condition: service_healthy
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      mysql-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  ingestion-test-files: