spring:
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    # schema.sql se ejecuta DESPUÉS de Hibernate DDL para crear la tabla shedlock
    # (no es una entidad JPA, por lo que Hibernate no la crea automáticamente)
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  flyway:
    enabled: false
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

logging:
  level:
    root: WARN
    com.silvio: INFO
