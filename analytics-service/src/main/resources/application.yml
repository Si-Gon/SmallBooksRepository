spring:
  application:
    name: analytics-service
  config:
    import: optional:configserver:http://localhost:8888

  # Resilience4j — Circuit Breaker para Feign Clients
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  # Sin BD propia — calcula métricas consultando E-Lending via Feign
  autoconfigure:
    exclude: >
      org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,
      org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,
      org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

logging:
  file:
    name: logs/smallbooks.log   # ← se crea en la raíz del proyecto
  level:
    root: INFO
    com.silvio: DEBUG           # ← para ver los logs de la aplicación
  pattern:
    level: "%5p [%mdc{traceId:-NONE} %mdc{spanId:-NONE}]"

# Resilience4j Circuit Breaker — configuracion global y por cliente Feign
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 5s
    instances:
      elending-service:
        base-config: default

  # Timeout global para Feign calls (evita hilos colgados)
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
        cancel-running-future: true

# Tracing distribuido — fallback local cuando el Config Server no está disponible
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans